name: little_learners
description: A fresh Flutter app starter.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/little_learners_splash_clean.png
    - assets/images/little_learners_meadow.png
    - assets/images/google_logo.png
    - assets/characters/wave.png
    - assets/audio/reading/
